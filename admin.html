<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CBT Studio - Painel Admin</title>
    <!-- NOVO: Biblioteca de estilos para os balões explicativos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/intro.js/7.2.0/introjs.min.css">
</head>
<body style="font-family: Arial, sans-serif; background-color: #ECEFF1; padding: 20px; text-align: center;">

    <!-- TELA DE LOGIN -->
    <div id="login-screen" style="max-width: 400px; margin: 0 auto; background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1);">
        <h2 style="color: #0277BD;">CBT Studio Login</h2>
        <input type="email" id="email" placeholder="E-mail" style="width: 100%; padding: 10px; margin-bottom: 10px; box-sizing: border-box;">
        <input type="password" id="password" placeholder="Senha" style="width: 100%; padding: 10px; margin-bottom: 20px; box-sizing: border-box;">
        <button id="btn-login" style="width: 100%; padding: 12px; background: #0277BD; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold;">Entrar</button>
        <p id="login-error" style="color: red; font-size: 0.9em; display: none;"></p>
    </div>

    <!-- TELA DO PAINEL -->
    <div id="dashboard-screen" style="display: none; max-width: 800px; margin: 0 auto; background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); text-align: left;">
        
        <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #ECEFF1; padding-bottom: 15px; margin-bottom: 20px;">
            <h2 style="color: #0277BD; margin: 0;">👨‍🏫 Painel do Professor</h2>
            <div>
                <!-- NOVO: Botão que ativa os balões -->
                <button id="btn-ajuda" style="background: #4CAF50; color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; margin-right: 10px; font-weight: bold;">❓ Guia Rápido</button>
                <button id="btn-logout" style="background: #D32F2F; color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer;">Sair</button>
            </div>
        </div>

        <!-- MENU DE NAVEGAÇÃO INTERNA -->
        <div style="display: flex; gap: 10px; margin-bottom: 20px;">
            <button id="tab-criar" style="flex: 1; padding: 10px; background: #0288D1; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold;">📝 Criar Nova</button>
            <button id="tab-corrigir" style="flex: 1; padding: 10px; background: #FFB300; color: #333; border: none; border-radius: 5px; cursor: pointer; font-weight: bold;">✅ Corrigir</button>
            <button id="tab-gerenciar" style="flex: 1; padding: 10px; background: #E53935; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold;">🗑️ Gerenciar</button>
        </div>
        
        <!-- SECÇÃO 1: CRIAR PROVAS -->
        <div id="section-criar">
            <div style="background: #E3F2FD; padding: 15px; border-radius: 8px; border: 1px solid #BBDEFB;">
                <h3 style="margin-top: 0; color: #1565C0;">🤖 Criador Automatizado de Provas</h3>
                
                <div data-title="Passo 1: A Chave" data-intro="Cole sua chave do Google Gemini aqui. Ela é obrigatória para gerar e corrigir as provas.">
                    <label style="font-weight: bold; display: block; font-size: 0.9em;">Chave da API do Google Gemini (Usada para criar e corrigir):</label>
                    <input type="password" id="gemini-api-key" placeholder="Cole sua API Key aqui" style="width: 100%; padding: 8px; margin-top: 5px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box;">
                </div>
                
                <hr style="margin: 20px 0; border: 0; border-top: 1px solid #BBDEFB;">

                <div data-title="Passo 2: O Título" data-intro="Dê um nome para a matéria. É assim que ela vai aparecer no menu dos alunos.">
                    <label style="font-weight: bold; display: block;">Nome da Matéria:</label>
                    <input type="text" id="materia-nome" placeholder="Ex: Ciências - O Sistema Solar" style="width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box;">
                </div>

                <div style="display: flex; gap: 10px; margin-top: 15px;" data-title="Passo 3: As Questões" data-intro="Escolha quantas perguntas de múltipla escolha e quantas questões escritas a IA deve criar.">
                    <div style="flex: 1;">
                        <label style="font-weight: bold; font-size: 0.9em;">Múltipla Escolha (Qtd):</label>
                        <input type="number" id="qtd-objetivas" value="20" min="1" max="50" style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 5px;">
                    </div>
                    <div style="flex: 1;">
                        <label style="font-weight: bold; font-size: 0.9em;">Dissertativas (Qtd):</label>
                        <input type="number" id="qtd-dissertativas" value="0" min="0" max="20" style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 5px;">
                    </div>
                </div>

                <div data-title="Passo 4: O PDF Visual" data-intro="Opcional: Cole aqui o link de compartilhamento do seu PDF no Google Drive para o aluno ler na tela dele.">
                    <label style="font-weight: bold; margin-top: 15px; display: block;">Link do PDF (Google Drive) - Opcional:</label>
                    <input type="text" id="materia-pdf" placeholder="Cole o link de compartilhamento público do Google Drive aqui..." style="width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box;">
                </div>

                <div data-title="Passo 5: O Cérebro da IA" data-intro="Cole o texto da matéria aqui. A IA vai ler apenas este texto para elaborar as perguntas e o gabarito.">
                    <label style="font-weight: bold; margin-top: 15px; display: block;">Material de Estudo (O texto base para a Inteligência Artificial):</label>
                    <textarea id="materia-conteudo" rows="8" placeholder="Cole o texto puro aqui para a IA ler e gerar a prova..." style="width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box;"></textarea>
                </div>
                
                <button id="btn-gerar-ia" data-title="Passo 6: A Mágica" data-intro="Clique aqui! O sistema vai se comunicar com o Google e gerar a prova em segundos." style="background-color: #673AB7; color: white; padding: 15px; border: none; border-radius: 5px; font-size: 1.1em; font-weight: bold; cursor: pointer; margin-top: 15px; width: 100%;">Ler Material e Criar Questões (IA) ✨</button>
                <div id="ai-status" style="text-align: center; margin-top: 10px; font-size: 0.9em; font-weight: bold;"></div>
            </div>

            <div data-title="Passo 7: O Código" data-intro="A prova gerada aparecerá aqui em formato de código de programação. Você não precisa alterar nada.">
                <label style="font-weight: bold; margin-top: 25px; display: block;">Código JSON da Prova (Gerado pela IA):</label>
                <textarea id="materia-questoes" rows="8" placeholder='Aguardando Inteligência Artificial...' style="width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box;"></textarea>
            </div>

            <button id="btn-salvar" data-title="Passo 8: Publicação" data-intro="Por fim, clique aqui para salvar a prova e enviá-la instantaneamente para o aplicativo dos seus alunos!" style="background-color: #4CAF50; color: white; padding: 15px; border: none; width: 100%; border-radius: 5px; font-size: 1.2em; margin-top: 20px; cursor: pointer; font-weight: bold;">Publicar Prova no App dos Alunos ☁️</button>
            <div id="status" style="text-align: center; margin-top: 15px; font-weight: bold;"></div>
        </div>

            <label style="font-weight: bold; margin-top: 25px; display: block;">Código JSON da Prova (Gerado pela IA):</label>
            <textarea id="materia-questoes" rows="8" placeholder='Aguardando Inteligência Artificial...' style="width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box;"></textarea>

            <button id="btn-salvar" style="background-color: #4CAF50; color: white; padding: 15px; border: none; width: 100%; border-radius: 5px; font-size: 1.2em; margin-top: 20px; cursor: pointer; font-weight: bold;">Publicar Prova no App dos Alunos ☁️</button>
            <div id="status" style="text-align: center; margin-top: 15px; font-weight: bold;"></div>
        </div>

        <!-- SECÇÃO 2: CORREÇÃO -->
        <div id="section-corrigir" style="display: none;">
            <h3 style="color: #E65100; margin-top: 0;">⏳ Alunos Aguardando Correção</h3>
            <button id="btn-carregar-pendencias" style="background: #ECEFF1; border: 1px solid #ccc; padding: 8px 15px; border-radius: 5px; cursor: pointer; margin-bottom: 15px;">Atualizar Lista 🔄</button>
            
            <div id="lista-pendencias" style="display: flex; flex-direction: column; gap: 15px;">
                <p style="color: #757575;">Clique em 'Atualizar Lista' para buscar provas.</p>
            </div>
        </div>

        <!-- SECÇÃO 3: GERENCIAR PROVAS -->
        <div id="section-gerenciar" style="display: none;">
            <h3 style="color: #C62828; margin-top: 0;">🗑️ Banco de Provas Ativas</h3>
            <button id="btn-carregar-provas" style="background: #ECEFF1; border: 1px solid #ccc; padding: 8px 15px; border-radius: 5px; cursor: pointer; margin-bottom: 15px;">Atualizar Lista 🔄</button>
            
            <div id="lista-provas-gerenciar" style="display: flex; flex-direction: column; gap: 10px;">
                <p style="color: #757575;">Clique em 'Atualizar Lista' para ver as provas do servidor.</p>
            </div>
        </div>

    </div>

    <!-- SCRIPT DOS BALÕES -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/intro.js/7.2.0/intro.min.js"></script>
    <script type="module" src="./admin.js"></script>
</body>
</html>
